[workspace]
resolver = "3"
members = ["crates/midda-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
repository = "https://github.com/lacodda/midda"
# Measured against the crates actually resolved, not copied from the toolchain.
# Raised only when a dependency or a feature needs it; the CI `msrv` job reads
# this number and builds on it, so it cannot silently rot.
rust-version = "1.88"

[workspace.lints.rust]
# `deny` rather than `forbid`: the on-disk size of a file is not in
# `std::fs::Metadata` and never will be — it comes from `GetCompressedFileSizeW`,
# which is one FFI call. `forbid` cannot be lifted locally, which would push that
# call into a second crate outside the workspace lint — more moving parts
# guarding less. Every `allow` carries its safety argument beside it.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Line-table debug info keeps backtraces readable while cutting the .pdb weight
# that dominates target/debug. Full debug info is a one-line revert when needed.
[profile.dev]
debug = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
