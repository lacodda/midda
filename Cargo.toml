[package]
name = "midda"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A disk space analyzer for Windows that tells you not just what is large, but what is safe to delete"
license = "MIT"
repository = "https://github.com/lacodda/midda"
homepage = "https://github.com/lacodda/midda"
readme = "README.md"
keywords = ["disk-usage", "treemap", "ntfs", "cleanup", "windows"]
categories = ["filesystem", "visualization"]
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
# assets/icon.ico is required by build.rs on Windows; the rest of the brand
# artwork only serves GitHub and the docs site.
exclude = [
    "docs/",
    ".github/",
    "cliff.toml",
    "rustfmt.toml",
    "assets/social-preview.png",
    "assets/logo-512.png",
    "assets/apple-touch-icon.png",
    "assets/favicon-32.png",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1"
thiserror = "2"

# UI: no GPU canvas here, so immediate mode is the fastest path to tables and treemaps
eframe = "0.36"
egui = "0.36"

# Scanning: the walkdir path works without elevation; the MFT path arrives in v0.3.0
walkdir = "2"
rayon = "1"
directories = "6"

[target.'cfg(windows)'.dependencies]
# MFT and USN Journal access (v0.3.0 / v0.4.0) — requires administrator privileges
ntfs-reader = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
