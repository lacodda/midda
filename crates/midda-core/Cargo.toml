[package]
name = "midda-core"
description = "The engine behind midda: scans a volume and builds the tree of what occupies it."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# A walk is a tree of independent subtrees, which is what a work-stealing pool
# is for: `rayon` is the whole job here, and writing a thread pool by hand to
# avoid one dependency is how the line gets a worse one.
rayon = "1"

[target.'cfg(windows)'.dependencies]
# Allocated size, compression and sparseness are not in `std::fs::Metadata`:
# they come from `GetFileInformationByHandleEx` / `FindFirstFileEx` and the
# attribute bits. `windows-sys` is the raw declarations with no wrapper layer.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

# The NTFS on-disk format: the boot sector, the map of where `$MFT` lives, and
# the attributes inside a record. Used for the format only — the crate's own
# `Mft` reads the whole table into memory, and the table is streamed instead
# (ADR 0006). A niche crate: after updating it, run the agreement test on a real
# volume, elevated.
ntfs-reader = "0.4"

[dev-dependencies]
tempfile = "3"
# The traits of an entry cross into the window as a number, not as a struct.
# A test that only checked the Rust side would not notice the representation
# changing under the bridge.
serde_json = "1"

[lints]
workspace = true
