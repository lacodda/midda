# How midda is released, read by furca's release engine: `furca release
# plan` says what the next release is and what stands in its way, `furca
# release run` carries it out - bump, changelog, gate, commit, push, green CI,
# tag - and checks what went out. `lyrn check` reads it too.
# Reference: https://lacodda.github.io/furca/reference/release/

[project]
name = "midda"
changelog = "CHANGELOG.md"
# The window and its core carry one version: the workspace root (for both
# crates and the path dependency between them), the frontend's package, and
# the bundle Tauri builds.
manifests = ["Cargo.toml", "package.json", "src-tauri/tauri.conf.json"]
# ADRs record what happened: the versions they name are history.
as_written = ["docs/adr/"]

[gate]
# Formatting only: it takes seconds and compiles nothing. The rest of the gate
# is CI, which the run waits for before the tag.
commands = [
    "cargo fmt --check",
]

[ci]
provider = "github"
workflow = "ci.yml"
# The tag's release page: the changelog's section and the Checked live list.
publish = "release.yml"

# The file the tag's release page has to carry, built by release.yml: the
# window, unpacked and run as it is. Checked after the publish.
[page]
assets = [
    "midda-{tag}-x86_64-pc-windows-msvc.zip",
]

# No [post.install] yet: the installer script of v0.23 brings it, with the
# proof that what it installed is this archive's own build.
